<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>
            Example Co - Job Application (synthetic Greenhouse-style fixture)
        </title>
    </head>
    <body>
        <!-- SYNTHETIC APPROXIMATION of a Greenhouse job-boards application form (its resume and
     cover-letter widgets follow greenhouse-upload.html: presign, upload, widget removes its input):
     <label for>, first_name/last_name/email/phone, a resume upload group,
     required question_ fields, a role=group radio question and a
     "Voluntary self-identification" section. Replace/augment with a
     captured real page after the first supervised run. -->
        <main>
            <form
                id="application-form"
                method="post"
                action="/example-company/jobs/0000"
            >
                <h2>Apply for this job</h2>
                <div class="field">
                    <label for="first_name">First Name *</label
                    ><input
                        id="first_name"
                        name="first_name"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="last_name">Last Name *</label
                    ><input
                        id="last_name"
                        name="last_name"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="email">Email *</label
                    ><input
                        id="email"
                        name="email"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="phone">Phone</label
                    ><input id="phone" name="phone" type="text" />
                </div>
                <div class="field upload" data-field="resume">
                    <div id="resume-label">Resume/CV *</div>
                    <div
                        role="group"
                        aria-labelledby="resume-label"
                        class="upload-widget"
                    >
                        <input
                            id="resume"
                            name="resume"
                            type="file"
                            required
                            aria-required="true"
                        />
                    </div>
                    <span class="upload-status"></span>
                </div>
                <div class="field upload" data-field="cover_letter">
                    <div id="cover-label">Cover Letter</div>
                    <div class="upload-widget">
                        <input
                            id="cover_letter"
                            name="cover_letter"
                            type="file"
                            aria-labelledby="cover-label"
                        />
                    </div>
                    <span class="upload-status"></span>
                </div>
                <div class="field">
                    <label for="question_1">LinkedIn Profile</label
                    ><input id="question_1" name="question_1" type="text" />
                </div>
                <div class="field">
                    <label for="question_2">Website</label
                    ><input id="question_2" name="question_2" type="text" />
                </div>
                <div class="field">
                    <label for="question_3"
                        >Why do you want to work here? *</label
                    ><textarea
                        id="question_3"
                        name="question_3"
                        required
                        aria-required="true"
                    ></textarea>
                </div>
                <fieldset role="group" aria-labelledby="sponsor-label">
                    <legend id="sponsor-label">
                        Will you now or in the future require sponsorship? *
                    </legend>
                    <label
                        ><input
                            type="radio"
                            name="question_4"
                            value="1"
                            required
                        />
                        Yes</label
                    >
                    <label
                        ><input
                            type="radio"
                            name="question_4"
                            value="0"
                            required
                        />
                        No</label
                    >
                </fieldset>
                <h3>Voluntary self-identification</h3>
                <div class="field">
                    <label for="gender">Gender</label
                    ><select id="gender" name="gender">
                        <option value="">Select</option>
                        <option>Female</option>
                        <option>Male</option>
                    </select>
                </div>
                <button type="submit" class="btn">Submit application</button>
            </form>
        </main>
        <script>
            const presigned = fetch(
                '/uncacheable_attributes/presigned_fields?fields[]=resume&fields[]=cover_letter',
            ).then((r) => r.json());
            for (const input of document.querySelectorAll('input[type=file]')) {
                input.addEventListener('change', async () => {
                    const box = input.closest('.upload');
                    const status = box.querySelector('.upload-status');
                    const file = input.files[0];
                    try {
                        const meta = await presigned;
                        const info = meta[box.dataset.field];
                        const form = new FormData();
                        form.append('utf8', '✓');
                        for (const k in info.fields)
                            form.append(k, info.fields[k]);
                        form.append(
                            'key',
                            info.key
                                .replace('{timestamp}', String(Date.now()))
                                .replace(
                                    '{unique_id}',
                                    Math.random().toString(36).slice(2, 16),
                                ),
                        );
                        form.append('authenticity_token', '1234');
                        form.append('Content-Type', 'application/octet-stream');
                        form.append('file', file);
                        const xhr = new XMLHttpRequest();
                        xhr.onloadend = () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                box.querySelector('.upload-widget').innerHTML =
                                    '<span class="filename">' +
                                    file.name +
                                    '</span> <button type="button">Remove</button>';
                            } else {
                                status.textContent = 'Upload failed';
                            }
                        };
                        xhr.onerror = () => {
                            status.textContent = 'Upload failed';
                        };
                        xhr.open('POST', meta.url);
                        xhr.send(form);
                    } catch (e) {
                        status.textContent = 'Upload failed';
                    }
                });
            }
        </script>
    </body>
</html>
