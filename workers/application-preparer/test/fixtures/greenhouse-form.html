<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>
            Example Co - Job Application (synthetic Greenhouse-style fixture)
        </title>
    </head>
    <body>
        <!-- SYNTHETIC APPROXIMATION of a Greenhouse job-boards application form:
     <label for>, first_name/last_name/email/phone, a resume upload group,
     required question_ fields, a role=group radio question and a
     "Voluntary self-identification" section. Replace/augment with a
     captured real page after the first supervised run. -->
        <main>
            <form
                id="application-form"
                method="post"
                action="/example-company/jobs/0000"
            >
                <h2>Apply for this job</h2>
                <div class="field">
                    <label for="first_name">First Name *</label
                    ><input
                        id="first_name"
                        name="first_name"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="last_name">Last Name *</label
                    ><input
                        id="last_name"
                        name="last_name"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="email">Email *</label
                    ><input
                        id="email"
                        name="email"
                        type="text"
                        required
                        aria-required="true"
                    />
                </div>
                <div class="field">
                    <label for="phone">Phone</label
                    ><input id="phone" name="phone" type="text" />
                </div>
                <div class="field">
                    <div id="resume-label">Resume/CV *</div>
                    <div role="group" aria-labelledby="resume-label">
                        <input
                            id="resume"
                            name="resume"
                            type="file"
                            required
                            aria-required="true"
                        />
                    </div>
                </div>
                <div class="field">
                    <div id="cover-label">Cover Letter</div>
                    <input
                        id="cover_letter"
                        name="cover_letter"
                        type="file"
                        aria-labelledby="cover-label"
                    />
                </div>
                <div class="field">
                    <label for="question_1">LinkedIn Profile</label
                    ><input id="question_1" name="question_1" type="text" />
                </div>
                <div class="field">
                    <label for="question_2">Website</label
                    ><input id="question_2" name="question_2" type="text" />
                </div>
                <div class="field">
                    <label for="question_3"
                        >Why do you want to work here? *</label
                    ><textarea
                        id="question_3"
                        name="question_3"
                        required
                        aria-required="true"
                    ></textarea>
                </div>
                <fieldset role="group" aria-labelledby="sponsor-label">
                    <legend id="sponsor-label">
                        Will you now or in the future require sponsorship? *
                    </legend>
                    <label
                        ><input
                            type="radio"
                            name="question_4"
                            value="1"
                            required
                        />
                        Yes</label
                    >
                    <label
                        ><input
                            type="radio"
                            name="question_4"
                            value="0"
                            required
                        />
                        No</label
                    >
                </fieldset>
                <h3>Voluntary self-identification</h3>
                <div class="field">
                    <label for="gender">Gender</label
                    ><select id="gender" name="gender">
                        <option value="">Select</option>
                        <option>Female</option>
                        <option>Male</option>
                    </select>
                </div>
                <button type="submit" class="btn">Submit application</button>
            </form>
        </main>
    </body>
</html>
