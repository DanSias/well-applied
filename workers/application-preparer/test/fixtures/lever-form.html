<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Example Co - Application (synthetic Lever-style fixture)</title>
    </head>
    <body class="application-page">
        <!-- SYNTHETIC APPROXIMATION of a Lever application form (field names and
     markup patterns: label > .application-label + .application-field, a
     "✱" required mark, urls[...] fields, cards[...] custom questions).
     Replace/augment with a captured real page after the first supervised run. -->
        <div class="content">
            <form
                id="application-form"
                method="POST"
                action="/example-company/0000/apply"
                enctype="multipart/form-data"
            >
                <ul>
                    <li class="application-question resume">
                        <label
                            ><div class="application-label">
                                Resume/CV <span class="required">✱</span>
                            </div>
                            <div class="application-field">
                                <input
                                    type="file"
                                    name="resume"
                                    id="resume-upload-input"
                                    required
                                /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">
                                Full name <span class="required">✱</span>
                            </div>
                            <div class="application-field">
                                <input type="text" name="name" required /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">
                                Email <span class="required">✱</span>
                            </div>
                            <div class="application-field">
                                <input type="text" name="email" required /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">Phone</div>
                            <div class="application-field">
                                <input type="text" name="phone" /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">
                                Current location
                            </div>
                            <div class="application-field">
                                <input type="text" name="location" /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">
                                Current company
                            </div>
                            <div class="application-field">
                                <input type="text" name="org" /></div
                        ></label>
                    </li>
                </ul>
                <h4>Links</h4>
                <ul>
                    <li class="application-question">
                        <label
                            ><div class="application-label">LinkedIn URL</div>
                            <div class="application-field">
                                <input type="text" name="urls[LinkedIn]" /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">GitHub URL</div>
                            <div class="application-field">
                                <input type="text" name="urls[GitHub]" /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">Portfolio URL</div>
                            <div class="application-field">
                                <input
                                    type="text"
                                    name="urls[Portfolio]"
                                /></div
                        ></label>
                    </li>
                    <li class="application-question">
                        <label
                            ><div class="application-label">Other website</div>
                            <div class="application-field">
                                <input type="text" name="urls[Other]" /></div
                        ></label>
                    </li>
                </ul>
                <h4>Custom questions</h4>
                <ul>
                    <li class="application-question custom-question">
                        <label
                            ><div class="application-label">
                                Are you legally authorized to work in the United
                                States? <span class="required">✱</span>
                            </div>
                            <div class="application-field">
                                <ul data-qa="multiple-choice">
                                    <li>
                                        <label
                                            ><input
                                                type="radio"
                                                name="cards[a1][field0]"
                                                value="Yes"
                                                required
                                            /><span
                                                class="application-answer-alternative"
                                                >Yes</span
                                            ></label
                                        >
                                    </li>
                                    <li>
                                        <label
                                            ><input
                                                type="radio"
                                                name="cards[a1][field0]"
                                                value="No"
                                                required
                                            /><span
                                                class="application-answer-alternative"
                                                >No</span
                                            ></label
                                        >
                                    </li>
                                </ul>
                            </div></label
                        >
                    </li>
                    <li class="application-question custom-question">
                        <label
                            ><div class="application-label">
                                How did you hear about this job?
                            </div>
                            <div class="application-field">
                                <select name="cards[a2][field0]">
                                    <option value="">Select...</option>
                                    <option>Referral</option>
                                    <option>Job board</option>
                                    <option>Other</option>
                                </select>
                            </div></label
                        >
                    </li>
                    <li class="application-question custom-question">
                        <label
                            ><div class="application-label">
                                Additional information
                            </div>
                            <div class="application-field">
                                <textarea name="comments"></textarea></div
                        ></label>
                    </li>
                </ul>
                <h4>Voluntary self-identification</h4>
                <ul>
                    <li class="application-question">
                        <label
                            ><div class="application-label">Gender</div>
                            <div class="application-field">
                                <select name="eeo[gender]">
                                    <option value="">Select...</option>
                                    <option>Female</option>
                                    <option>Male</option>
                                    <option>Decline to self-identify</option>
                                </select>
                            </div></label
                        >
                    </li>
                </ul>
                <div id="hcaptchaResponseInput"></div>
                <button
                    type="submit"
                    id="btn-submit"
                    class="postings-btn template-btn-submit"
                >
                    Submit application
                </button>
            </form>
        </div>
    </body>
</html>
