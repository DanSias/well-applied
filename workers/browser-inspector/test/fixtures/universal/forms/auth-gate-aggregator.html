<!doctype html>
<!-- M0 fixture (synthetic). A job-aggregator listing modelled on facts observed on one real aggregator listing (see the architecture review): the visible Apply links go nowhere new, the real Apply control is a button that opens a sign-in dialog, and the employer's application URL is not in the page. -->
<html lang="en"><head><meta charset="utf-8"><title>Remote Senior Backend Engineer at Example Co - Example Jobs</title>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Senior Backend Engineer","hiringOrganization":{"@type":"Organization","name":"Example Co","sameAs":"https://www.example.test/"}}</script></head>
<body><main>
<h1>Senior Backend Engineer</h1><p>Example Co is hiring a backend engineer. Remote.</p>
<div class="actions"><a href="#job-application">Apply for this job</a></div>
<section id="job-application"><h2>Apply now.</h2><p>Follow the employer's application method.</p>
 <a href="./auth-gate-aggregator.html" target="_blank">Apply now</a>
 <button id="open-apply" type="button" aria-haspopup="dialog" aria-controls="gate">Apply</button></section>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
 <h2 id="gate-title">Sign in to continue.</h2>

 <form method="post" action="/__trap/signin"><label for="gate-email">Email</label><input id="gate-email" type="email"><label for="gate-password">Password</label><input id="gate-password" type="password"><button type="submit">Sign in</button></form>
 <button type="button" id="gate-create">Create account</button></div>
</main></body></html>
