# Isolated deployment of the browser inspector (see isolation/README.md). Untrusted web pages run JavaScript in this
# container's Chromium, so the container is deliberately boxed in:
#
#   egress       br-inspector   the WORKER's only route to the internet. The host's nftables policy lets it reach public
#                               web ports only: no LAN, no tailnet, no cloud metadata, no host, no IPv6.
#   relay-link   br-relaylink   internal (no gateway): worker <-> relay, nothing else. The worker reaches Well Applied
#                               ONLY through the relay, which exposes two POST endpoints and nothing more.
#   relay-out    br-relay       the RELAY's only route to Well Applied (the Mac's Tailscale address, 100.84.185.81:8000, through tailscale0), and nothing else.
#
# The bridge names, subnets, the Well Applied address and the resolvers are mirrored in isolation/inspector-isolation.nft
# and relay/nginx.conf; test/isolation-config.test.js fails if any of them drift apart.
#
# Start and stop it with the systemd unit (isolation/well-applied-browser-inspector.service), not by hand: the unit refuses
# to start it unless the host policy is verified, and kills it if the policy is lost. Both services therefore have
# `restart: "no"`: Docker must never start them on its own (for instance at boot, before the policy exists). If someone does
# `docker compose up` by hand anyway, the worker's own start-up check and the host guard (which kills any container carrying
# the isolation label when the policy is missing) still apply.
name: well-applied-browser-inspector

x-isolated: &isolated
  restart: "no"
  labels:
    com.well-applied.isolation: required
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  init: true
  stop_grace_period: 30s

services:
  api-relay:
    <<: *isolated
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: well-applied-api-relay
    volumes:
      - ./relay/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      relay-link: {}
      relay-out: {}
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }

  browser-inspector:
    <<: *isolated
    build: .
    image: well-applied-browser-inspector:local
    container_name: well-applied-browser-inspector
    env_file:
      - .env
    environment:
      # Always the relay, whatever .env says: a stale .env cannot point the worker straight at the Mac.
      CAREER_TOOLKIT_URL: http://api-relay:8081
      BROWSER_WORKER_REQUIRE_ISOLATION: "1"
      # Chromium's own sandbox. Playwright runs Chromium with --no-sandbox unless this is set, and then a launch that cannot get
      # the sandbox fails instead of quietly running without it. Needs the seccomp profile below.
      BROWSER_WORKER_CHROMIUM_SANDBOX: "1"
      # Canaries the policy must refuse (closed ports on this deployment's own addresses): the bridge gateways, the AI box on
      # the LAN, the AI box's own tailnet address, and the Mac's tailnet address (the worker may never reach Well Applied
      # directly; only the relay may).
      BROWSER_WORKER_ISOLATION_CANARIES: "172.29.60.1:9,172.29.61.1:9,172.29.62.1:9,192.168.1.111:9,100.119.215.69:9,100.84.185.81:9"
    depends_on:
      - api-relay
    # Docker's default seccomp profile with exactly four syscalls (clone, unshare, setns, chroot) allowed to unprivileged
    # processes so Chromium can build its sandbox (derived by isolation/make-chromium-seccomp.py; see isolation/README.md).
    # NOT seccomp=unconfined: every other rule of the default profile stays.
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./isolation/chromium-seccomp.json"
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      egress:
        gw_priority: 100
      relay-link: {}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/pwuser:size=256m,mode=0755,uid=1001,gid=1001
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-inspector
    ipam:
      config:
        - subnet: 172.29.60.0/24
          gateway: 172.29.60.1
  relay-link:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-relaylink
    ipam:
      config:
        - subnet: 172.29.61.0/24
          gateway: 172.29.61.1
  relay-out:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-relay
    ipam:
      config:
        - subnet: 172.29.62.0/24
          gateway: 172.29.62.1
