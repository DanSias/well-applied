# The only way the inspector reaches Well Applied. A fixed, two-endpoint relay, not a proxy:
#
#   POST /api/worker/agent-runs/claim
#   POST /api/worker/agent-runs/<number>/result
#
# Everything else is 404, and there is no resolver, no variable upstream and no way to name another host. The upstream is
# the Mac's address (isolation/inspector-isolation.nft allows exactly this address and port from the relay's bridge, so even
# a bug here cannot reach anything else).
#
# Path handling is strict on purpose: the RAW request line must already be exactly one of the two canonical forms (no
# encoding, dot segments, repeated slashes or query string), so there is nothing for normalisation to disagree about, and
# what is forwarded is nginx's own normalised $uri, which by then equals the raw path.
#
# Authentication: Well Applied checks the bearer token. The relay additionally refuses a request that carries none, so an
# unauthenticated request never reaches the UI's server at all. The token is neither logged (access_log is off) nor altered.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/c;
  proxy_temp_path /tmp/p;
  fastcgi_temp_path /tmp/f;
  uwsgi_temp_path /tmp/u;
  scgi_temp_path /tmp/s;

  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  large_client_header_buffers 2 8k;

  upstream well_applied {
    server 192.168.1.114:8000;
    keepalive 2;
  }

  server {
    listen 8081;

    # 1. the raw request line must be exactly an allowed path
    if ($request_uri !~ "^/api/worker/agent-runs/(claim|[0-9]{1,12}/result)$") { return 404; }
    # 2. POST only
    if ($request_method != POST) { return 405; }
    # 3. a bearer token must be present (Well Applied decides whether it is the right one)
    if ($http_authorization !~ "^Bearer [^\s]{8,512}$") { return 401; }

    # What is sent upstream is nginx's normalised $uri, which the checks above have already forced to equal the raw path.
    location = /api/worker/agent-runs/claim {
      proxy_pass http://well_applied$uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location ~ "^/api/worker/agent-runs/[0-9]{1,12}/result$" {
      proxy_pass http://well_applied$uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location / { return 404; }
  }
}
